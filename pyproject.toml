[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditsift"
version = "0.1.0"
description = "Local-first multi-phase security audits with verified, machine-readable findings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Auditsift contributors" }]
keywords = ["security", "sast", "sarif", "ci", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
auditsift = "auditsift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["auditsift", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
